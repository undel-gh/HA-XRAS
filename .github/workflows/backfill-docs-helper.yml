name: Backfill docs helper

on:
  push:
    branches:
      - feat/historical-backfill

permissions:
  contents: write

jobs:
  edit:
    if: contains(github.event.head_commit.message, '[docs-backfill]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/historical-backfill
      - name: Update README and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          old = """Код региона является идентичностью записи и после создания не меняется.\nВ **Настроить** можно изменить только интервал опроса. Если нужен другой\nрегион, удалите запись и создайте новую — так история сущностей разных\nрегионов не смешивается.\n"""
          new = """Код региона является идентичностью записи и после создания не меняется.\nВ **Настроить** можно изменить интервал опроса и включить историческую загрузку\nсуточных максимумов Kp. Если нужен другой регион, удалите запись и создайте\nновую — так история разных регионов не смешивается.\n"""
          if old not in text:
              raise SystemExit("installation marker not found")
          text = text.replace(old, new, 1)

          marker = "\n## Сущности\n"
          history = r'''
## Историческая статистика Kp

Историческая загрузка **выключена по умолчанию**, чтобы установка интеграции не
создавала дополнительные запросы к XRAS. В **Настроить** параметр «История для
загрузки, мес.» можно установить от `1` до `24`; `0` полностью отключает
дальнейшую синхронизацию истории.

Архив XRAS `kpm_<код>_ГГГГММ` содержит только **максимум Kp за календарные
сутки**. Исходных трёхчасовых значений в этом файле нет, поэтому интеграция не
подмешивает архив в Long-Term Statistics сенсора `kp_current`: это исказило бы
его `min`/`mean`/`max`. Вместо этого создаётся отдельная external statistic:

```text
xras_geomagnetic:kp_daily_max_ral5
```

Последняя часть — код региона в нижнем регистре (`RIK0` →
`xras_geomagnetic:kp_daily_max_rik0`). Эту статистику можно указывать прямо в
карточках Home Assistant, например:

```yaml
type: statistics-graph
entities:
  - xras_geomagnetic:kp_daily_max_ral5
days_to_show: 365
period: day
stat_types:
  - max
```

Для текущего месяца дополнительные запросы не выполняются: суточные максимумы
берутся из обычного `kpm_<код>`, который coordinator и так загружает. Для
завершённых месяцев используются архивы `kpm_<код>_ГГГГММ`: они запрашиваются
последовательно с паузой 30 секунд. Уже полностью импортированный месяц не
скачивается снова; частичный месяц после перехода на следующий месяц остаётся
кандидатом на восстановление.

Если XRAS недоступен, вернул повреждённый ответ или архив не разбирается,
историческая загрузка останавливается на 6 часов и не перебирает остальные
месяцы. Ошибка истории не влияет на обычное обновление интеграции и доступность
текущих сущностей. Отсутствующий архив (`404`) пропускается на текущий запуск.
Состояние backfill и причина последней ошибки доступны в диагностике записи.

Каждое архивное значение записывается в статистику с отметкой `12:00 UTC` как
нейтральным маркером соответствующей даты. Это **не время достижения
максимума**: XRAS сообщает только суточное значение и не сообщает, в каком
трёхчасовом интервале оно было достигнуто.

Отключение backfill (`0`) прекращает дальнейшую синхронизацию, но не удаляет
уже импортированную Long-Term Statistics из Recorder.
'''
          if marker not in text:
              raise SystemExit("entities marker not found")
          text = text.replace(marker, "\n" + history + marker, 1)

          old_archive = """* На сайте есть архив по месяцам: `kpm_RAL5_202506.json` — тот же формат плюс\n  суффикс `_ГГГГММ`. Интеграция его не использует (Home Assistant хранит свою\n  историю), но для разовой выгрузки прошлых месяцев он удобен."""
          new_archive = """* На сайте есть архив по месяцам: `kpm_RAL5_202506.json` — тот же формат плюс\n  суффикс `_ГГГГММ`. При включённом historical backfill интеграция использует\n  эти файлы только для отдельной статистики суточного максимума Kp; восстановить\n  из них исходный трёхчасовой ряд невозможно."""
          if old_archive not in text:
              raise SystemExit("archive note marker not found")
          text = text.replace(old_archive, new_archive, 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/backfill-docs-helper.yml").unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows/backfill-docs-helper.yml
          git commit -m "docs: document historical Kp backfill"
          git push origin HEAD:feat/historical-backfill
