name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2024.12.0"
            python: "3.13"
            requirements: requirements_test_minimum.txt
          - ha: "2026.10.1"
            python: "3.14"
            requirements: requirements_test.txt
          - ha: "2026.10.4"
            python: "3.14"
            requirements: requirements_test_latest.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install test dependencies
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Verify Home Assistant version
        env:
          EXPECTED_HA: ${{ matrix.ha }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          actual = version("homeassistant")
          expected = os.environ["EXPECTED_HA"]
          print(f"Home Assistant {actual}")
          assert actual == expected, f"expected Home Assistant {expected}, got {actual}"
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Check English translation parity
        run: cmp custom_components/xras_geomagnetic/strings.json custom_components/xras_geomagnetic/translations/en.json

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    name: HACS
    runs-on: ubuntu-latest

    steps:
      - name: Validate with HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
